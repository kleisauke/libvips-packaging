name: Question
description: Ask a question about the libvips-packaging repository
labels:
  - question
body:
  - type: checkboxes
    attributes:
      label: Humans asking relevant questions in their own voice
      options:
        - label: I am a human writing in my own words
          required: true
        - label: I am asking a question specifically about the libvips-packaging repository
          required: true
        - label: I understand that if the use of automated or LLM-based tooling is detected, this issue will be closed and the account may be blocked
          required: true
  - type: textarea
    attributes:
      label: Your question
    validations:
      required: true
