name: CI
on:
  push:
    branches:
      - main
      - 'temp-*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions: {}
jobs:
  check-latest-versions:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./check-latest-versions.sh && git diff --quiet
  build:
    permissions:
      contents: read
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: check-latest-versions
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
        platform:
          - 'linux-x64'
          - 'linux-arm'
          - 'linux-musl-x64'
          - 'win-x64'
          - 'win-x64.net462'
          - 'win-x86'
          - 'win-x86.net462'
          - 'win-arm64'
          - 'win-arm64.net481'
        include:
          - os: macos-15-intel
            platform: 'osx-x64'
          - os: macos-15
            platform: 'osx-arm64'
          - os: ubuntu-26.04-arm
            platform: 'linux-arm64'
          - os: ubuntu-26.04-arm
            platform: 'linux-musl-arm64'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pipx install meson
          brew install automake nasm
      - name: Expose GitHub Runtime for Docker Cache
        if: matrix.platform == 'linux-arm'
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build ${{ matrix.platform }}
        run: ./build.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.platform }}
          path: libvips-*-${{ matrix.platform }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          merge-multiple: true
      - name: Create GitHub release for tag
        uses: ncipollo/release-action@v1
        with:
          artifacts: libvips-*.tar.gz
          artifactContentType: application/gzip
          omitBody: true
          prerelease: true
